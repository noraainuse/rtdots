#fonts
font=PxPlus IBM VGA8:style=Regular:size=12
[colors-dark]
background=000000
foreground=c0c0c0

# selection แบบ W95 = พื้นน้ำเงินกรมท่า ตัวอักษรขาว
selection-background=000080
selection-foreground=ffffff

## Normal — ตรงกับพาเลต VGA/Windows 95
regular0=000000   # black
regular1=800000   # red
regular2=008000   # green
regular3=808000   # yellow
regular4=000080   # blue  = สี title bar
regular5=800080   # magenta
regular6=008080   # cyan  = สี desktop teal!
regular7=c0c0c0   # white = สีหน้าต่าง silver

## Bright
bright0=808080    # เทาเข้ม = สี shadow ของ bevel
bright1=ff0000
bright2=00ff00
bright3=ffff00
bright4=0000ff
bright5=ff00ff
bright6=00ffff
bright7=ffffff

